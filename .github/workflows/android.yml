name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create the Android project
        working-directory: mobile
        run: |
          npm install
          npx cap add android

      - name: Patch (icons, screenshot block, UPI, Google sign in)
        working-directory: mobile
        run: node patch-android.mjs

      - name: Use your signing key (keeps updates and Google sign in working)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          else
            echo "::warning::KEYSTORE_B64 secret is missing. A new key is used each build, so Google sign in will not work."
          fi

      - name: Set the app version (needed by Google Play, must go up each build)
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" mobile/android/app/build.gradle
          grep -n "versionCode\|versionName" mobile/android/app/build.gradle

      - name: Build APK and AAB
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon

      - name: Sign the AAB
        run: |
          jarsigner -keystore ~/.android/debug.keystore -storepass android -keypass android -sigalg SHA256withRSA -digestalg SHA-256 mobile/android/app/build/outputs/bundle/release/app-release.aab androiddebugkey
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab ar-academy.aab

      - name: Show the signing SHA-1
        run: |
          echo "### Signing SHA-1 (add this to the Android OAuth client)" >> $GITHUB_STEP_SUMMARY
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android 2>/dev/null | grep -E "SHA1|SHA-1" >> $GITHUB_STEP_SUMMARY || true

      - name: Name the file
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk ar-academy.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}
          name: AR Academy app ${{ github.run_number }}
          make_latest: true
          files: |
            ar-academy.apk
            ar-academy.aab
