<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><link rel="manifest" href="/manifest.json"><link rel="icon" href="/icons/icon.svg"><link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>AR Academy - Home</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Source+Serif+4:ital,wght@1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/glass.css">
</head>
<body>
<script type="module">
import { mountShell, requireUser, api, esc, icon, BOARD, BRANCH, MEDIUM, study, lastNote, pref, promoBanner } from '/js/app.js';
import { TT_BRANCH, papersFor, nextPaper, startOf } from '/js/timetable.js';
import { offlineSync, offlineSaved } from '/js/offline.js';
const view = mountShell('dashboard', 'Home', 'Your study <em>desk</em>', '');
const [me, notes] = await Promise.all([requireUser(), api('/api/notes')]);
await offlineSync(me.id, notes);
const saved = new Set((await offlineSaved(me.id)).map(m => m.noteId));
const off = !navigator.onLine || !!notes.cached;
const mine = notes.filter(n => n.status === 'approved');
const wait = notes.filter(n => n.status === 'pending' && n.hasShot).length;
const hr = new Date().getHours(), hi = hr < 12 ? 'Good morning' : hr < 17 ? 'Good afternoon' : 'Good evening';
view.parentElement.querySelector('.page-head h1').innerHTML = hi + ', <em>' + esc(me.firstName || 'student') + '</em>';
const last = lastNote.get(), lastN = last && mine.find(n => n.id === last.id);
const ex = pref.get('exams', null) || (TT_BRANCH[me.branch] ? { b: TT_BRANCH[me.branch], sem: 0 } : null);
const np = ex && ex.sem ? nextPaper(papersFor(ex.b, ex.sem, ex.sch)) : null;
const days = np ? Math.max(0, Math.ceil((new Date(startOf(np).toDateString()) - new Date(new Date().toDateString())) / 864e5)) : null;
const where = me.board === 'ssc' ? 'SSC ' + (MEDIUM[me.medium] || '') : (BRANCH[me.branch] || 'MSBTE');
const promo = await promoBanner(notes);
view.innerHTML = `
  ${promo}
  <div class="hello reveal" style="--d:.05s"><span class="tag">${esc(BOARD[me.board] || '')}</span><span class="muted">${esc(where)}</span></div>
  <div class="grid g-stats reveal" style="--d:.1s">
    <div class="card stat liquid-glass"><div class="label">Unlocked</div><div class="num">${mine.length}</div></div>
    <div class="card stat liquid-glass"><div class="label">Studied today</div><div class="num">${study.today()}<small>min</small></div></div>
    <div class="card stat liquid-glass"><div class="label">Streak</div><div class="num">${study.streak()}<small>days</small></div></div>
    <div class="card stat liquid-glass"><a href="/exams" style="display:block"><div class="label">${np ? esc(np.n.slice(0, 18)) : 'Next exam'}</div><div class="num">${days !== null ? days + '<small>days</small>' : 'Set'}</div></a></div>
  </div>
  ${lastN ? `<a class="card liquid-glass resume reveal" style="--d:.15s" href="/viewer?id=${lastN.id}"><div><div class="eyebrow">Continue reading</div><h3>${esc(lastN.title)}</h3></div><span class="btn white sm">Resume</span></a>` : ''}
  <div class="tools reveal" style="--d:.2s">
    <a class="tool liquid-glass hoverable" href="/focus">${icon('timer')}<b>Focus timer</b><span>25 min sessions</span></a>
    <a class="tool liquid-glass hoverable" href="/notes">${icon('book')}<b>Browse notes</b><span>For your branch</span></a>
    <a class="tool liquid-glass hoverable" href="/exams">${icon('cal')}<b>Exam timetable</b><span>Days left for each paper</span></a>
  </div>
  ${wait ? '<div class="card liquid-glass" style="margin-top:14px"><div class="muted">We are checking your payment. Your notes will show up here as soon as it is confirmed.</div></div>' : ''}
  <div class="sec"><h2>My <em>notes</em></h2><a href="/notes">Browse more</a></div>
  <div class="grid g-cards">
    ${mine.map(n => `
      <div class="card liquid-glass">
        <div style="display:flex;justify-content:space-between;align-items:center"><span class="tag">${n.board === 'ssc' ? 'SSC' : 'MSBTE'}</span>${saved.has(n.id) ? '<span class="tag ok">Offline</span>' : ''}</div>
        <h3 style="margin:14px 0 6px">${esc(n.title)}</h3>
        <div class="muted">Sem ${esc(n.semester)}${n.subjectCode ? ' &middot; ' + esc(n.subjectCode) : ''}</div>
        <div class="foot"><span></span>${off && !saved.has(n.id)
          ? '<span class="btn liquid-glass sm dim">Needs internet</span>'
          : `<a class="btn liquid-glass-strong hoverable sm" href="/viewer?id=${n.id}">${icon('file')}Open notes</a>`}</div>
      </div>`).join('') || '<div class="empty" style="grid-column:1/-1">Nothing unlocked yet. <a href="/notes">Browse notes</a></div>'}
  </div>`;
</script>
</body>
</html>
