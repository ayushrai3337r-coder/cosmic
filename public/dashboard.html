<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><link rel="manifest" href="/manifest.json"><link rel="icon" href="/icons/icon.svg"><link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>Cosmic - Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Source+Serif+4:ital,wght@1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/glass.css">
</head>
<body>
<script type="module">
import { mountShell, requireUser, api, esc, fmtDate, tag, icon, BOARD } from '/js/app.js';
const view = mountShell('dashboard', 'Overview', 'Your study <em>desk</em>', 'Everything you have unlocked and everything waiting for approval.');
const me = await requireUser();
const orders = await api('/api/orders');
const ok = orders.filter(o => o.status === 'approved');
const pend = orders.filter(o => o.status === 'pending');
view.innerHTML = `
  <div class="grid g-stats reveal" style="--d:.1s">
    <div class="card stat liquid-glass"><div class="label">Unlocked</div><div class="num">${ok.length}</div></div>
    <div class="card stat liquid-glass"><div class="label">Pending</div><div class="num">${pend.length}</div></div>
    <div class="card stat liquid-glass"><div class="label">Orders</div><div class="num">${orders.length}</div></div>
    <div class="card stat liquid-glass"><div class="label">Board</div><div class="num" style="font-size:1.05rem;padding-top:10px">${esc(BOARD[me.board] || '-')}</div></div>
  </div>
  <div class="sec"><h2>My <em>notes</em></h2><a href="/notes">Browse more</a></div>
  <div class="grid g-cards">
    ${ok.map(o => `
      <div class="card liquid-glass">
        <span class="tag">${o.board === 'ssc' ? 'SSC' : 'MSBTE'}</span>
        <h3 style="margin:14px 0 6px">${esc(o.title)}</h3>
        <div class="muted">Ordered ${fmtDate(o.createdAt)}</div>
        <div class="foot"><span></span><a class="btn liquid-glass-strong hoverable sm" href="/viewer?id=${o.noteId}">${icon('file')}Open notes</a></div>
      </div>`).join('') || '<div class="empty" style="grid-column:1/-1">Nothing unlocked yet. <a href="/notes">Browse notes</a></div>'}
  </div>
  <div class="sec"><h2>Recent orders</h2><a href="/orders">View all</a></div>
  <div class="list">
    ${orders.slice(0, 3).map(o => `
      <div class="row liquid-glass">
        <div class="grow"><h3>${esc(o.title)}</h3><div class="muted">${fmtDate(o.createdAt)}</div></div>
        <div class="price">Rs ${o.amount}</div>${tag(o.status)}
      </div>`).join('') || '<div class="empty">No orders yet</div>'}
  </div>`;
</script>
</body>
</html>
