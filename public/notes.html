<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><link rel="manifest" href="/manifest.json"><link rel="icon" href="/icons/icon.svg"><link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>Cosmic - Notes</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Source+Serif+4:ital,wght@1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/glass.css">
</head>
<body>
<script type="module">
import { mountShell, requireUser, api, esc, toast, BRANCH } from '/js/app.js';
const view = mountShell('notes', 'Library', 'Browse <em>notes</em>', 'Pick a subject, pay with UPI and it unlocks once your payment is approved.');
await requireUser();
const notes = await api('/api/notes');
let board = 'all', q = '';
const $ = id => document.getElementById(id);

view.innerHTML = `
  <div class="reveal" style="--d:.1s">
    <input class="input" id="q" placeholder="Search by title, branch or code" style="margin-bottom:14px">
    <div class="chips">
      <button class="chip liquid-glass hoverable on" data-b="all">All</button>
      <button class="chip liquid-glass hoverable" data-b="msbte">MSBTE</button>
      <button class="chip liquid-glass hoverable" data-b="ssc">SSC</button>
    </div>
  </div>
  <div class="grid g-cards" id="grid"></div>`;

document.body.insertAdjacentHTML('beforeend', `
  <div class="modal" id="m"><div class="box liquid-glass-strong">
    <div class="eyebrow">Checkout</div>
    <h3 id="m-t"></h3>
    <div class="price" id="m-a"></div>
    <p class="muted" style="margin-top:12px">Tap Pay with UPI, finish the payment in your UPI app, then upload the screenshot on the Orders page. Notes unlock after approval.</p>
    <div class="acts" style="margin-top:22px">
      <a class="btn white hoverable" id="m-pay" href="#">Pay with UPI</a>
      <a class="btn liquid-glass hoverable" href="/orders">I have paid</a>
      <button class="btn liquid-glass hoverable" id="m-x">Close</button>
    </div>
  </div></div>`);
$('m-x').onclick = () => $('m').classList.remove('open');

function draw() {
  const list = notes.filter(n => (board === 'all' || n.board === board) && (!q || [n.title, n.branch, n.subjectCode].join(' ').toLowerCase().includes(q)));
  $('grid').innerHTML = list.map(n => {
    const btn = n.status === 'approved' ? `<a class="btn liquid-glass-strong hoverable sm" href="/viewer?id=${n.id}">Open</a>`
      : n.status === 'pending' ? '<a class="btn liquid-glass-strong hoverable sm" href="/orders">Pending</a>'
      : `<button class="btn liquid-glass-strong hoverable sm" data-buy="${n.id}">${n.price === 0 ? 'Get free' : 'Buy now'}</button>`;
    return `
      <div class="card liquid-glass">
        <div style="display:flex;justify-content:space-between;align-items:center"><span class="tag">${n.board === 'ssc' ? 'SSC' : 'MSBTE'}</span><span class="muted">Sem ${esc(n.semester)}</span></div>
        <h3 style="margin:14px 0 6px">${esc(n.title)}</h3>
        <div class="muted">${esc(BRANCH[n.branch] || n.branch)}${n.subjectCode ? ' &middot; ' + esc(n.subjectCode) : ''}</div>
        <p class="muted" style="margin-top:8px">${esc(n.description)}</p>
        <div class="foot"><div class="price">${n.price === 0 ? 'Free' : 'Rs ' + n.price}</div>${btn}</div>
      </div>`;
  }).join('') || '<div class="empty" style="grid-column:1/-1">No notes found</div>';
}
draw();

$('q').oninput = e => { q = e.target.value.toLowerCase().trim(); draw(); };
view.querySelector('.chips').addEventListener('click', e => {
  const c = e.target.closest('[data-b]');
  if (!c) return;
  board = c.dataset.b;
  view.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === c));
  draw();
});

$('grid').addEventListener('click', async e => {
  const b = e.target.closest('[data-buy]');
  if (!b) return;
  b.disabled = true;
  try {
    const n = notes.find(x => x.id === Number(b.dataset.buy));
    const r = await api('/api/orders', { noteId: n.id });
    n.status = r.status;
    if (r.status === 'approved') { toast('Unlocked. Open it from your dashboard.'); draw(); return; }
    $('m-t').textContent = n.title;
    $('m-a').textContent = 'Rs ' + r.amount;
    $('m-pay').href = r.upi;
    $('m').classList.add('open');
    draw();
  } catch (err) { toast(err.message); }
  b.disabled = false;
});
</script>
</body>
</html>
