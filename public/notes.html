<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><link rel="manifest" href="/manifest.json"><link rel="icon" href="/icons/icon.svg"><link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>AR Academy - Notes</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Source+Serif+4:ital,wght@1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/glass.css">
</head>
<body>
<script type="module">
import { mountShell, requireUser, api, payModal, esc, toast, BRANCH, MEDIUM, promoBanner } from '/js/app.js';
const view = mountShell('notes', 'Library', 'Browse <em>notes</em>', 'Pick a subject, pay with your UPI app, and it unlocks once your payment is confirmed.');
const [me, loaded] = await Promise.all([requireUser(), api('/api/notes').catch(e => e)]);
if (loaded instanceof Error) { view.innerHTML = '<div class="empty">Could not load notes: ' + esc(loaded.message) + '</div>'; throw loaded; }
let notes = loaded, board = 'mine', q = '';
const $ = id => document.getElementById(id);

view.innerHTML = `
  ${await promoBanner(notes)}
  <div class="reveal" style="--d:.1s">
    <input class="input" id="q" placeholder="Search by title, branch or code" style="margin-bottom:14px">
    <div class="chips">
      <button class="chip liquid-glass hoverable on" data-b="mine">For me</button>
      <button class="chip liquid-glass hoverable" data-b="all">All</button>
      <button class="chip liquid-glass hoverable" data-b="msbte">MSBTE</button>
      <button class="chip liquid-glass hoverable" data-b="ssc">SSC</button>
    </div>
  </div>
  <div class="grid g-cards" id="grid"></div>`;

const pay = payModal(async () => { notes = await api('/api/notes'); draw(); });

function button(n) {
  if (n.status === 'approved') return `<a class="btn liquid-glass-strong hoverable sm" href="/viewer?id=${n.id}">Open</a>`;
  if (n.status === 'pending' && n.hasShot) return '<span class="btn liquid-glass sm dim">Checking payment</span>';
  if (n.status === 'pending') return `<button class="btn liquid-glass-strong hoverable sm" data-buy="${n.id}">Complete payment</button>`;
  return `<button class="btn liquid-glass-strong hoverable sm" data-buy="${n.id}">${n.price === 0 ? 'Get free' : 'Buy now'}</button>`;
}

function draw() {
  const mineOk = n => n.board === me.board && (me.board === 'ssc' ? (!n.medium || n.medium === me.medium) : ((!n.branch || n.branch === me.branch || n.branch === 'all') && (!me.semester || !n.semester || n.semester === 'all' || n.semester === me.semester)));
  const list = notes.filter(n => (board === 'all' || (board === 'mine' ? mineOk(n) : n.board === board)) && (!q || [n.title, n.branch, n.subjectCode].join(' ').toLowerCase().includes(q)));
  $('grid').innerHTML = list.map(n => `
      <div class="card liquid-glass">
        <div style="display:flex;justify-content:space-between;align-items:center"><span class="tag">${n.board === 'ssc' ? 'SSC' : 'MSBTE'}</span><span class="muted">${n.board === 'ssc' && n.medium ? esc(MEDIUM[n.medium]) : 'Sem ' + esc(n.semester)}</span></div>
        <h3 style="margin:14px 0 6px">${esc(n.title)}</h3>
        <div class="muted">${esc(BRANCH[n.branch] || n.branch)}${n.subjectCode ? ' &middot; ' + esc(n.subjectCode) : ''}</div>
        <p class="muted" style="margin-top:8px">${esc(n.description)}</p>
        <div class="foot"><div class="price">${n.price === 0 ? 'Free' : 'Rs ' + n.price}</div>${button(n)}</div>
      </div>`).join('') || '<div class="empty" style="grid-column:1/-1">No notes found</div>';
}
draw();

$('q').oninput = e => { q = e.target.value.toLowerCase().trim(); draw(); };
view.querySelector('.chips').addEventListener('click', e => {
  const c = e.target.closest('[data-b]');
  if (!c) return;
  board = c.dataset.b;
  view.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === c));
  draw();
});

async function buy(id) {
  const n = notes.find(x => x.id === id);
  if (!n) return;
  try {
    if (n.status === 'approved') { location.href = '/viewer?id=' + n.id; return; }
    const r = await api('/api/orders', { noteId: n.id });
    n.status = r.status;
    if (r.status === 'approved') { toast('Unlocked. Open it from your dashboard.'); draw(); return; }
    n.hasShot = false;
    draw();
    pay.open({ id: r.id, title: n.title, amount: r.amount });
  } catch (err) { toast(err.message); }
}
$('grid').addEventListener('click', async e => {
  const b = e.target.closest('[data-buy]');
  if (!b) return;
  b.disabled = true;
  await buy(Number(b.dataset.buy));
  b.disabled = false;
});
const want = Number(new URLSearchParams(location.search).get('buy')) || 0;
if (want) buy(want);
</script>
</body>
</html>
