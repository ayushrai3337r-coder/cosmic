<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><link rel="manifest" href="/manifest.json"><link rel="icon" href="/icons/icon.svg"><link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>AR Academy - Messages</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Source+Serif+4:ital,wght@1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/glass.css">
</head>
<body>
<script type="module">
import { mountShell, requireUser, api, esc, toast } from '/js/app.js';
const view = mountShell('chat', 'Support', 'Message <em>us</em>', 'Ask about notes, payments or your account. Only the AR Academy team can read this chat.');
await requireUser();
view.innerHTML = `<div class="chat liquid-glass reveal">
  <div class="chat-list" id="cl"><div class="muted" style="text-align:center;padding:20px">Loading...</div></div>
  <form class="chat-in" id="cf"><input class="input" id="ct" maxlength="1000" placeholder="Type a message" autocomplete="off"><button class="btn white hoverable" id="cb" type="submit">Send</button></form>
</div>`;
const $ = id => document.getElementById(id);
const list = $('cl');
let last = 0, first = true;
const time = d => new Date(d).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
function add(ms) {
  if (!ms.length) { if (first) list.innerHTML = '<div class="muted" style="text-align:center;padding:20px">No messages yet. Say hello!</div>'; first = false; return; }
  if (first) list.innerHTML = '';
  first = false;
  const near = list.scrollHeight - list.scrollTop - list.clientHeight < 120;
  for (const m of ms) {
    if (m.id <= last) continue;
    last = m.id;
    list.insertAdjacentHTML('beforeend', `<div class="bub ${m.fromAdmin ? 'them' : 'me'}"><div>${esc(m.body)}</div><small>${m.fromAdmin ? 'AR Academy &middot; ' : ''}${time(m.at)}</small></div>`);
  }
  if (near || ms.length > 3) list.scrollTop = list.scrollHeight;
}
async function pull() { try { add((await api('/api/chat?after=' + last)).messages); } catch (e) { if (first) list.innerHTML = '<div class="muted" style="text-align:center;padding:20px">Could not load messages.</div>'; } }
await pull();
setInterval(() => { if (!document.hidden) pull(); }, 5000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) pull(); });
$('cf').onsubmit = async e => {
  e.preventDefault();
  const t = $('ct').value.trim();
  if (!t) return;
  $('cb').disabled = true;
  try { const r = await api('/api/chat', { body: t }); $('ct').value = ''; add([r.message]); list.scrollTop = list.scrollHeight; }
  catch (err) { toast(err.message || 'Could not send'); }
  $('cb').disabled = false;
  $('ct').focus();
};
</script>
</body>
</html>
