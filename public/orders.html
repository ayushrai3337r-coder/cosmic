<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><link rel="manifest" href="/manifest.json"><link rel="icon" href="/icons/icon.svg"><link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>Cosmic - Orders</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Source+Serif+4:ital,wght@1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/glass.css">
</head>
<body>
<script type="module">
import { mountShell, requireUser, api, payModal, esc, fmtDate, tag } from '/js/app.js';
const view = mountShell('orders', 'Payments', 'Your <em>orders</em>', 'Scan the QR, pay, and upload your screenshot so we can approve your access.');
await requireUser();
let orders = [], f = 'all';
const pay = payModal(async () => { orders = await api('/api/orders'); draw(); });

function draw() {
  const pend = orders.filter(o => o.status === 'pending').length;
  const spent = orders.filter(o => o.status === 'approved').reduce((s, o) => s + o.amount, 0);
  const list = orders.filter(o => f === 'all' || o.status === f);
  view.innerHTML = `
    <div class="grid g-stats" style="grid-template-columns:repeat(3,1fr)">
      <div class="card stat liquid-glass"><div class="label">Orders</div><div class="num">${orders.length}</div></div>
      <div class="card stat liquid-glass"><div class="label">Pending</div><div class="num">${pend}</div></div>
      <div class="card stat liquid-glass"><div class="label">Spent</div><div class="num">Rs ${spent}</div></div>
    </div>
    <div class="chips" style="margin-top:22px">
      ${['all', 'pending', 'approved', 'rejected'].map(s => `<button class="chip liquid-glass hoverable ${f === s ? 'on' : ''}" data-f="${s}">${s}</button>`).join('')}
    </div>
    <div class="list">
      ${list.map(o => {
        const act = o.status === 'approved' ? `<a class="btn liquid-glass-strong hoverable sm" href="/viewer?id=${o.noteId}">Open notes</a>`
          : o.status === 'rejected' ? '<span class="muted">Rejected. Contact support with your order number.</span>'
          : o.hasShot ? '<span class="muted">Screenshot sent. Waiting for approval.</span>'
          : `<button class="btn liquid-glass-strong hoverable sm" data-pay="${o.id}">Scan, pay and upload</button>`;
        return `
          <div class="row liquid-glass">
            <div class="grow"><h3>${esc(o.title)}</h3><div class="muted">Order #${o.id} &middot; ${fmtDate(o.createdAt)}</div></div>
            <div class="price">Rs ${o.amount}</div>${tag(o.status)}
            <div class="acts">${act}</div>
          </div>`;
      }).join('') || '<div class="empty">No orders here. <a href="/notes">Browse notes</a></div>'}
    </div>`;
}

view.addEventListener('click', e => {
  const c = e.target.closest('[data-f]');
  if (c) { f = c.dataset.f; draw(); return; }
  const p = e.target.closest('[data-pay]');
  if (p) {
    const o = orders.find(x => x.id === Number(p.dataset.pay));
    pay.open({ id: o.id, title: o.title, amount: o.amount });
  }
});

orders = await api('/api/orders');
draw();
</script>
</body>
</html>
