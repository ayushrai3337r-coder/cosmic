<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><link rel="manifest" href="/manifest.json"><link rel="icon" href="/icons/icon.svg"><link rel="apple-touch-icon" href="/icons/apple-touch.png">
<title>AR Academy - Exams</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Source+Serif+4:ital,wght@1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/glass.css">
</head>
<body>
<script type="module">
import { mountShell, requireUser, pref, esc } from '/js/app.js';
import { TT_BRANCH, TT_NAMES, schemesFor, papersFor, nextPaper, startOf } from '/js/timetable.js';
const view = mountShell('exams', 'Winter 2026', 'Exam <em>countdown</em>', 'MSBTE theory timetable. Pick your semester and see every paper with the days left.');
const me = await requireUser();
const $ = id => document.getElementById(id);
let S = pref.get('exams', null) || { b: TT_BRANCH[me.branch] || 'CO', sem: Number(me.semester) || 5, sch: '' };
const SCH = { I: 'I scheme', K: 'K scheme', G: 'G scheme', E: 'E scheme', C: 'C scheme' };
const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
view.innerHTML = `
  <div class="card liquid-glass next reveal" style="--d:.1s" id="nx"></div>
  <div class="card liquid-glass reveal" style="--d:.2s;margin-top:14px">
    <div class="eyebrow">Branch</div><div class="chips" id="cb" style="margin-top:10px"></div>
    <div class="eyebrow">Semester</div><div class="chips" id="cs" style="margin-top:10px"></div>
    <div class="eyebrow">Scheme</div><div class="chips" id="cc" style="margin:10px 0 0"></div>
  </div>
  ${TT_BRANCH[me.branch] ? '' : '<p class="muted" style="margin:12px 6px">This timetable covers Computer, IT, AI & ML, Civil and Mechanical only.</p>'}
  <div id="ls"></div>`;
const chip = (v, t, on, a) => `<button class="chip liquid-glass hoverable ${on ? 'on' : ''}" data-${a}="${v}">${t}</button>`;
let tick = null;
function draw() {
  const sc = schemesFor(S.b, S.sem);
  if (S.sch && !sc.includes(S.sch)) S.sch = '';
  pref.set('exams', S);
  $('cb').innerHTML = Object.keys(TT_NAMES).map(k => chip(k, k, S.b === k, 'b')).join('');
  $('cs').innerHTML = [1, 2, 3, 4, 5, 6].map(n => chip(n, 'Sem ' + n, S.sem === n, 's')).join('');
  $('cc').innerHTML = chip('', 'All', !S.sch, 'c') + sc.map(c => chip(c, SCH[c] || c, S.sch === c, 'c')).join('');
  const list = papersFor(S.b, S.sem, S.sch), nx = nextPaper(list), now = new Date();
  let last = '';
  $('ls').innerHTML = list.length ? '<div class="sec"><h2>All <em>papers</em></h2><span class="muted">' + list.length + ' papers</span></div><div class="list">' + list.map(r => {
    const d = startOf(r), dd = Math.ceil((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 864e5);
    const past = d.getTime() + 3 * 3600e3 < now.getTime();
    const mine = r.k.filter(x => x.startsWith(S.b + '-' + S.sem + '-')).map(x => x.split('-')[2]).join(' ');
    return `<div class="row liquid-glass paper ${past ? 'past' : ''} ${nx === r ? 'now' : ''}"><div class="dbox"><b>${d.getDate()}</b><span>${d.toLocaleDateString('en-IN', { month: 'short' })}</span></div>
      <div class="grow"><h3>${esc(r.n)}</h3><div class="muted">${r.c} &middot; ${DAYS[d.getDay()]} &middot; ${r.st.replace(/\./g, '')} - ${r.en.replace(/\./g, '')} &middot; ${esc(mine)}</div></div>
      <span class="tag ${nx === r ? 'ok' : ''}">${past ? 'Done' : dd === 0 ? 'Today' : dd === 1 ? 'Tomorrow' : dd + ' days'}</span></div>`;
  }).join('') + '</div>' : '<div class="empty">No papers found for this choice.</div>';
  clearInterval(tick);
  const box = $('nx');
  if (!nx) { box.innerHTML = '<div class="eyebrow">Next paper</div><h3 style="margin-top:8px">' + (list.length ? 'All your papers are done. Well done!' : 'Pick your semester below') + '</h3>'; return; }
  const t = startOf(nx);
  box.innerHTML = `<div class="eyebrow">Next paper &middot; ${esc(TT_NAMES[S.b])} Sem ${S.sem}</div><h3 style="margin:8px 0 14px;font-size:1.25rem">${esc(nx.n)}</h3>
    <div class="cd"><div><b id="cd-d">0</b><span>days</span></div><div><b id="cd-h">0</b><span>hours</span></div><div><b id="cd-m">0</b><span>min</span></div><div><b id="cd-s">0</b><span>sec</span></div></div>
    <div class="muted" style="margin-top:14px">${t.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long' })} &middot; ${nx.st.replace(/\./g, '')} to ${nx.en.replace(/\./g, '')}</div>`;
  const go = () => {
    let s = Math.max(0, Math.floor((t - new Date()) / 1000));
    $('cd-d').textContent = Math.floor(s / 86400); s %= 86400;
    $('cd-h').textContent = Math.floor(s / 3600); s %= 3600;
    $('cd-m').textContent = Math.floor(s / 60);
    $('cd-s').textContent = String(s % 60).padStart(2, '0');
  };
  go();
  tick = setInterval(go, 1000);
}
view.addEventListener('click', e => {
  const b = e.target.closest('[data-b],[data-s],[data-c]');
  if (!b) return;
  if (b.dataset.b) S.b = b.dataset.b;
  if (b.dataset.s) S.sem = Number(b.dataset.s);
  if (b.dataset.c !== undefined) S.sch = b.dataset.c;
  draw();
});
draw();
</script>
</body>
</html>
