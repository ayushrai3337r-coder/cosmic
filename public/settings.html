<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><link rel="manifest" href="/manifest.json"><link rel="icon" href="/icons/icon.svg"><link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>Cosmic - Settings</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Source+Serif+4:ital,wght@1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/glass.css">
</head>
<body>
<script type="module">
import { mountShell, requireUser, api, clearToken, esc, fmtDate, icon, BOARD, BRANCH } from '/js/app.js';
const view = mountShell('settings', 'Preferences', '<em>Settings</em>', 'Your account details and session.');
const me = await requireUser();
const rows = [['Email', me.email || me.phone], ['Board', BOARD[me.board]], ['Branch', BRANCH[me.branch]], ['Member since', fmtDate(me.createdAt)]];
view.innerHTML = `
  <div class="list reveal" style="max-width:640px;--d:.1s">
    ${rows.map(([k, v]) => `<div class="row liquid-glass"><div class="grow muted">${k}</div><div>${esc(v || '-')}</div></div>`).join('')}
    <div class="row liquid-glass"><div class="grow"><h3>One device only</h3><div class="muted">Signing in on another device signs this one out.</div></div></div>
    <div class="row liquid-glass">
      <div class="grow"><h3>Sign out</h3><div class="muted">End your session on this device.</div></div>
      <button class="btn liquid-glass-strong hoverable" id="out">${icon('logout')}Sign out</button>
    </div>
  </div>`;
document.getElementById('out').onclick = async () => {
  try { await api('/api/auth/logout', {}); } catch (e) {}
  clearToken();
  location.href = '/';
};
</script>
</body>
</html>
