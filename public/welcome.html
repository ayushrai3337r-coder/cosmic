<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><link rel="manifest" href="/manifest.json"><link rel="icon" href="/icons/icon.svg"><link rel="apple-touch-icon" href="/icons/apple-touch.png">
<title>AR Academy - Welcome</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Source+Serif+4:ital,wght@1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/glass.css">
</head>
<body>
<main class="auth">
  <div class="box wide liquid-glass-strong reveal">
    <img class="hero-mark" src="/icons/icon.svg" alt="AR Academy" width="64" height="64" style="margin-bottom:12px">
    <div class="steps" id="dots"><i class="on"></i><i></i><i></i></div>
    <div id="p1">
      <h1>Which <em>board</em> are you in?</h1>
      <p class="sub">We will show only the notes that match you.</p>
      <div class="pick">
        <button class="opt liquid-glass hoverable" data-b="msbte"><b>MSBTE</b><span>Diploma Engineering</span></button>
        <button class="opt liquid-glass hoverable" data-b="ssc"><b>SSC</b><span>Maharashtra Board, Class 10</span></button>
      </div>
    </div>
    <div id="p2" hidden>
      <h1 id="t2"></h1>
      <p class="sub" id="s2"></p>
      <div class="pick two-col" id="opts"></div>
      <button class="link" id="back2">Back</button>
    </div>
    <div id="p3" hidden>
      <h1>Pick your <em>semester</em></h1>
      <p class="sub" id="s3"></p>
      <div class="pick two-col sems" id="sems"><button class="opt sm liquid-glass hoverable" data-sem="1"><b>Sem 1</b><span>Winter exam</span></button><button class="opt sm liquid-glass hoverable" data-sem="2"><b>Sem 2</b><span>Summer exam</span></button><button class="opt sm liquid-glass hoverable" data-sem="3"><b>Sem 3</b><span>Winter exam</span></button><button class="opt sm liquid-glass hoverable" data-sem="4"><b>Sem 4</b><span>Summer exam</span></button><button class="opt sm liquid-glass hoverable" data-sem="5"><b>Sem 5</b><span>Winter exam</span></button><button class="opt sm liquid-glass hoverable" data-sem="6"><b>Sem 6</b><span>Summer exam</span></button></div>
      <button class="link" id="back3">Back</button>
    </div>
    <p class="msg" id="msg"></p>
  </div>
</main>
<script type="module">
import { requireUser, api, BRANCH, BRANCH_PICK, MEDIUM, MEDIUM_NATIVE } from '/js/app.js';
const $ = id => document.getElementById(id);
const me = await requireUser(true);
if (me.onboarded !== false) location.replace('/dashboard');
let board = '', branch = '';
const dots = $('dots').children;
const show = n => {
  ['p1', 'p2', 'p3'].forEach((p, i) => { $(p).hidden = i !== n; });
  [...dots].forEach((d, i) => d.classList.toggle('on', i === n));
  $('msg').textContent = '';
};
async function save(extra) {
  $('msg').textContent = 'Saving...';
  try {
    await api('/api/me', { board, onboarded: true, ...extra }, { method: 'PATCH' });
    await requireUser(true);
    location.replace('/dashboard');
  } catch (e) { $('msg').textContent = e.message; }
}
function step2(b) {
  board = b;
  show(1);
  if (b === 'msbte') {
    $('t2').innerHTML = 'Pick your <em>branch</em>';
    $('s2').textContent = 'MSBTE Diploma. Choose your engineering department.';
    $('opts').innerHTML = BRANCH_PICK.map(k => { const m = /^(.*) \((\w+)\)$/.exec(BRANCH[k]); return '<button class="opt sm liquid-glass hoverable" data-v="' + k + '"><b>' + m[2] + '</b><span>' + m[1] + '</span></button>'; }).join('');
  } else {
    $('t2').innerHTML = 'Pick your <em>medium</em>';
    $('s2').textContent = 'SSC Maharashtra. Choose the language you study in.';
    $('opts').innerHTML = Object.keys(MEDIUM).map(k => '<button class="opt sm liquid-glass hoverable" data-v="' + k + '"><b>' + MEDIUM_NATIVE[k] + '</b><span>' + MEDIUM[k] + '</span></button>').join('');
  }
}
document.querySelectorAll('[data-b]').forEach(x => x.onclick = () => step2(x.dataset.b));
$('opts').addEventListener('click', e => {
  const o = e.target.closest('[data-v]'); if (!o) return;
  o.classList.add('on');
  if (board === 'ssc') return save({ medium: o.dataset.v });
  branch = o.dataset.v;
  $('s3').textContent = BRANCH[branch] + '. Which semester are you in?';
  setTimeout(() => show(2), 180);
});
$('sems').addEventListener('click', e => {
  const o = e.target.closest('[data-sem]'); if (!o) return;
  o.classList.add('on');
  save({ branch, semester: o.dataset.sem });
});
$('back2').onclick = () => show(0);
$('back3').onclick = () => show(1);
</script>
</body>
</html>
