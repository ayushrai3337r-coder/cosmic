<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><link rel="icon" href="/icons/icon.svg">
<title>AR Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Source+Serif+4:ital,wght@1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;overflow:hidden;font-family:'Poppins',sans-serif;color:#fff}
canvas{position:fixed;inset:0;width:100%;height:100%}
.glow{position:fixed;left:50%;top:46%;width:150vmin;height:150vmin;margin:-75vmin 0 0 -75vmin;border-radius:50%;background:radial-gradient(circle,rgba(25,230,140,.30),transparent 62%);opacity:0;animation:glow 10s ease both}
.stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.line{position:absolute;top:50%;left:0;right:0;transform:translateY(-50%);font-size:clamp(1.1rem,4.6vw,1.9rem);font-weight:300;letter-spacing:.02em;padding:0 28px;opacity:0;animation:line 2.6s .3s ease both}
.line em{font-family:'Source Serif 4',serif;font-style:italic;color:#6dffc0}
svg{width:min(52vw,230px);height:auto;overflow:visible;opacity:0;animation:show .01s 2.6s forwards}
.l{fill:none;stroke:url(#ink);stroke-width:40;stroke-dasharray:1100;stroke-dashoffset:1100;animation:draw 2s 2.7s cubic-bezier(.6,0,.2,1) forwards}
.lg{fill:none;stroke:#19e68c;stroke-width:46;opacity:0;filter:blur(12px);stroke-dasharray:1100;stroke-dashoffset:1100;animation:draw 2s 2.7s cubic-bezier(.6,0,.2,1) forwards,pulse 2.4s 4.7s ease-in-out infinite}
.cap{opacity:0;transform:translateY(-60px) rotate(-8deg);transform-origin:200px 100px;animation:drop .9s 4.6s cubic-bezier(.3,1.5,.5,1) forwards}
.book{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1.2s 5s ease forwards}
.word{margin-top:26px;font-size:clamp(2rem,9vw,3rem);font-weight:600;letter-spacing:-.04em;opacity:0;transform:translateY(14px);animation:up 1.1s 5.6s cubic-bezier(.2,.9,.3,1) forwards}
.word em{font-family:'Source Serif 4',serif;font-style:italic;font-weight:400}
.tag{margin-top:10px;font-size:.7rem;letter-spacing:.5em;color:rgba(255,255,255,.55);opacity:0;animation:up 1s 6.4s ease forwards;padding-left:.5em}
.three{position:absolute;bottom:14%;left:0;right:0;display:flex;justify-content:center;gap:18px;font-size:1rem;color:#6dffc0;font-weight:500}
.three span{opacity:0;animation:up .8s ease forwards}
.three span:nth-child(1){animation-delay:7.4s}.three span:nth-child(2){animation-delay:8s}.three span:nth-child(3){animation-delay:8.6s}
.fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;animation:fade .8s 9.2s ease forwards}
#skip{position:fixed;right:18px;top:calc(18px + env(safe-area-inset-top));z-index:5;padding:9px 20px;border-radius:99px;font-size:.78rem;color:rgba(255,255,255,.8);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);opacity:0;animation:up .6s 1.5s forwards;font-family:inherit}
@keyframes line{0%{opacity:0;filter:blur(8px)}25%,70%{opacity:1;filter:none}100%{opacity:0;filter:blur(6px)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes show{to{opacity:1}}
@keyframes drop{to{opacity:1;transform:none}}
@keyframes up{to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.75}}
@keyframes glow{0%,25%{opacity:0}50%,90%{opacity:1}100%{opacity:1}}
@keyframes fade{to{opacity:1}}
</style>
</head>
<body>
<canvas id="c"></canvas><div class="glow"></div>
<div class="stage">
  <div class="line">Every topper started <em>somewhere</em>.<br><span style="opacity:.6;font-size:.8em">Your turn starts here.</span></div>
  <svg viewBox="30 70 340 380" aria-label="AR Academy">
    <defs><linearGradient id="ink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d8fff0"/><stop offset=".55" stop-color="#3df0a2"/><stop offset="1" stop-color="#0fb56b"/></linearGradient></defs>
    <path class="lg" d="M44 388 L168 176 V388 M96 306 H168 M168 176 H262 Q330 168 330 226 Q330 284 262 284 H168 M246 284 L336 388"/>
    <path class="l" d="M44 388 L168 176 V388 M96 306 H168 M168 176 H262 Q330 168 330 226 Q330 284 262 284 H168 M246 284 L336 388"/>
    <g class="cap"><path d="M168 66 L244 94 L168 122 L92 94 Z" fill="#eafff6"/><path d="M128 112 V136 Q168 158 208 136 V112 L168 126 Z" fill="#3df0a2"/><path d="M244 94 V132" stroke="#eafff6" stroke-width="5" stroke-linecap="round"/><circle cx="244" cy="138" r="6" fill="#3df0a2"/></g>
    <path class="book" d="M38 432 Q112 410 196 436 Q280 410 354 432" fill="none" stroke="#6dffc0" stroke-width="5" stroke-linecap="round"/>
  </svg>
  <div class="word">AR <em>Academy</em></div>
  <div class="tag">LEARN &middot; FOCUS &middot; SCORE</div>
  <div class="three"><span>Learn.</span><span>Focus.</span><span>Score.</span></div>
</div>
<button id="skip">Skip</button>
<div class="fade"></div>
<script>
(function () {
  var c = document.getElementById('c'), x = c.getContext('2d'), W, H, S = [], t0 = Date.now(), done = false;
  function size() { var d = Math.min(window.devicePixelRatio || 1, 1.5); W = c.width = innerWidth * d; H = c.height = innerHeight * d; }
  size(); addEventListener('resize', size);
  for (var i = 0; i < 140; i++) S.push({ a: Math.random() * 6.283, r: Math.random(), z: Math.random(), g: Math.random() < .25 });
  function frame() {
    if (done) return;
    var t = (Date.now() - t0) / 1000, sp = t < 2.6 ? 0.012 + t * 0.012 : Math.max(0.0015, 0.04 - (t - 2.6) * 0.012);
    x.fillStyle = 'rgba(0,0,0,.28)'; x.fillRect(0, 0, W, H);
    var cx = W / 2, cy = H * .46, m = Math.max(W, H);
    for (var i = 0; i < S.length; i++) {
      var s = S[i], r0 = s.r; s.r += sp * (0.4 + s.z * 1.6) * (0.2 + s.r);
      if (s.r > 1.1) { s.r = Math.random() * .05; s.a = Math.random() * 6.283; s.z = Math.random(); }
      var d0 = r0 * m * .75, d1 = s.r * m * .75, ca = Math.cos(s.a), sa = Math.sin(s.a);
      x.strokeStyle = s.g ? 'rgba(109,255,192,' + (0.25 + s.r * .6) + ')' : 'rgba(255,255,255,' + (0.15 + s.r * .6) + ')';
      x.lineWidth = (0.6 + s.r * 1.8) * (W / 800 > 1 ? 1.4 : 1);
      x.beginPath(); x.moveTo(cx + ca * d0, cy + sa * d0); x.lineTo(cx + ca * d1, cy + sa * d1); x.stroke();
    }
    requestAnimationFrame(frame);
  }
  frame();
  function go() {
    if (done) return; done = true;
    var tk = null; try { tk = localStorage.getItem('cosmic_token'); } catch (e) {}
    location.replace(tk ? '/dashboard' : '/login');
  }
  document.getElementById('skip').onclick = go;
  setTimeout(go, 10000);
})();
</script>
</body>
</html>
