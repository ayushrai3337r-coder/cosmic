<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><link rel="manifest" href="/manifest.json"><link rel="icon" href="/icons/icon.svg"><link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>Cosmic - Notes</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Source+Serif+4:ital,wght@1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/glass.css">
<style>
.vbar{position:fixed;top:calc(12px + env(safe-area-inset-top));left:12px;right:12px;z-index:20;display:flex;align-items:center;gap:14px;padding:8px 8px 8px 20px;border-radius:9999px}
.vbar strong{flex:1;font-weight:500;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pages{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;gap:12px;padding:84px 12px 40px}
#pages canvas{border-radius:12px;background:#fff;max-width:100%}
.state{position:relative;z-index:10;text-align:center;padding:140px 24px;color:rgba(255,255,255,.7)}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
<div class="vbar liquid-glass-strong"><strong id="t">Loading notes</strong><a class="btn liquid-glass hoverable sm" href="/dashboard">Back</a></div>
<div id="state" class="state">Opening your notes...</div>
<div id="pages"></div>
<script type="module">
import { mountBg, requireUser, api } from '/js/app.js';
mountBg();
const $ = id => document.getElementById(id);
try {
  const me = await requireUser();
  const id = new URLSearchParams(location.search).get('id');
  const f = await api('/api/notes/' + encodeURIComponent(id) + '/file');
  $('t').textContent = f.title;
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf = await pdfjsLib.getDocument(f.url).promise;
  $('state').remove();
  const width = Math.min(window.innerWidth - 24, 900), dpr = window.devicePixelRatio || 1;
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const base = page.getViewport({ scale: 1 });
    const vp = page.getViewport({ scale: (width / base.width) * dpr });
    const c = document.createElement('canvas');
    c.width = vp.width; c.height = vp.height;
    c.style.width = width + 'px';
    c.oncontextmenu = e => e.preventDefault();
    $('pages').appendChild(c);
    const ctx = c.getContext('2d');
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    ctx.save();
    ctx.globalAlpha = 0.07;
    ctx.fillStyle = '#000';
    ctx.font = (28 * dpr) + 'px Poppins, sans-serif';
    ctx.translate(c.width / 2, c.height / 2);
    ctx.rotate(-0.5);
    ctx.textAlign = 'center';
    ctx.fillText(me.phone, 0, 0);
    ctx.restore();
  }
} catch (e) {
  $('state').textContent = e.message && e.message.length < 90 ? e.message : 'Could not open these notes. Check that they are unlocked.';
}
</script>
</body>
</html>
