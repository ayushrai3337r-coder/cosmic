<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><link rel="manifest" href="/manifest.json"><link rel="icon" href="/icons/icon.svg"><link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="robots" content="noindex">
<title>Cosmic - Notes</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Source+Serif+4:ital,wght@1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/glass.css">
<style>
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.vbar{position:fixed;top:calc(12px + env(safe-area-inset-top));left:12px;right:12px;z-index:20;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 20px;border-radius:9999px}
.vbar strong{flex:1;font-weight:500;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pages{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;gap:12px;padding:84px 0 40px}
.pg{background:#fff;border-radius:12px;overflow:hidden;max-width:100%;pointer-events:none}
.pg canvas{display:block;width:100%;height:100%}
.state{position:relative;z-index:10;text-align:center;padding:140px 24px;color:rgba(255,255,255,.7)}
.state a{display:inline-block;margin-top:16px;text-decoration:underline}
.shield{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:#000;color:rgba(255,255,255,.6);font-size:.9rem;text-align:center;padding:24px}
body.hide .shield{display:flex}
body.hide #pages{visibility:hidden}
@media print{body{display:none!important}}
</style>
</head>
<body>
<div class="shield">Notes are hidden while this window is not in focus.</div>
<div class="vbar liquid-glass-strong"><strong id="t">Loading notes</strong><button class="btn liquid-glass hoverable sm" id="sv" hidden>Save offline</button><a class="btn liquid-glass hoverable sm" href="/dashboard">Back</a></div>
<div id="state" class="state">Opening your notes...</div>
<div id="pages"></div>
<script type="module">
import { requireUser, api, toast } from '/js/app.js';
import { offlineMeta, offlineValid, offlinePage, offlineSave, offlineRemove, offlineSync, watermark } from '/js/offline.js';
const $ = id => document.getElementById(id);

const hideNow = () => document.body.classList.add('hide');
const showNow = () => document.body.classList.remove('hide');
document.addEventListener('visibilitychange', () => (document.hidden ? hideNow() : showNow()));
if (matchMedia('(pointer:fine)').matches) { window.addEventListener('blur', hideNow); window.addEventListener('focus', showNow); }
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('dragstart', e => e.preventDefault());
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && ['p', 's', 'c', 'u'].includes(e.key.toLowerCase())) e.preventDefault();
});
document.addEventListener('keyup', e => {
  if (e.key === 'PrintScreen') {
    if (navigator.clipboard) navigator.clipboard.writeText('').catch(() => {});
    hideNow();
    setTimeout(showNow, 1500);
  }
});

function loadImg(url) {
  return new Promise((ok, no) => {
    const i = new Image();
    i.onload = () => ok(i);
    i.onerror = () => no(new Error('A page could not be loaded. Check your internet and try again.'));
    i.src = url;
  });
}

try {
  const me = await requireUser();
  const id = Number(new URLSearchParams(location.search).get('id')) || 0;

  /* a saved copy (kept only in this app's private storage) opens without internet */
  let meta = await offlineMeta(me.id, id);
  let saved = offlineValid(meta) ? meta : null;
  let f = null;
  if (!saved) {
    const W0 = Math.min(window.innerWidth - 24, 900), d0 = Math.min(window.devicePixelRatio || 1, 1.5);
    try { f = await api('/api/notes/' + id + '/file?w=' + Math.min(1400, Math.max(480, Math.round(W0 * d0 / 100) * 100))); }
    catch (e) {
      if (e.offline) throw new Error(meta ? 'Connect to the internet once to renew your saved notes.' : 'No internet connection. Save notes offline while you are online to read them anywhere.');
      throw e;
    }
  } else if (navigator.onLine) {
    api('/api/notes').then(n => offlineSync(me.id, n)).catch(() => {});
  }

  const count = saved ? saved.count : f.pages.length;
  $('t').textContent = saved ? saved.title : f.title;
  const mark = (me.email || me.phone || 'cosmic') + '  #' + me.id;
  const W = Math.min(window.innerWidth - 24, 900);
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);

  async function getImg(i) {
    if (!saved) return loadImg(f.pages[i]);
    const blob = await offlinePage(id, i);
    if (!blob) throw new Error('This saved note is incomplete. Save it again when you are online.');
    const u = URL.createObjectURL(blob);
    try { return await loadImg(u); } finally { URL.revokeObjectURL(u); }
  }

  const first = await getImg(0);
  $('state').hidden = true;
  const ratio = first.naturalHeight / first.naturalWidth;

  /* only pages near the screen are kept in memory, so long PDFs stay smooth on 1 GB phones */
  async function draw(d, pre) {
    if (d.dataset.s === '1') return;
    d.dataset.s = '1';
    try {
      const img = pre || await getImg(Number(d.dataset.i));
      if (d.dataset.s !== '1') return;
      const h = Math.round(W * img.naturalHeight / img.naturalWidth);
      d.style.height = h + 'px';
      const c = document.createElement('canvas');
      c.width = Math.round(W * dpr);
      c.height = Math.round(h * dpr);
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, c.width, c.height);
      if (!saved) watermark(ctx, c.width, c.height, mark, dpr);
      d.replaceChildren(c);
    } catch (e) { d.dataset.s = ''; }
  }
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) draw(e.target);
    else if (e.target.dataset.s === '1') { e.target.dataset.s = ''; e.target.replaceChildren(); }
  }), { rootMargin: '900px 0px' });

  const frag = document.createDocumentFragment();
  for (let i = 0; i < count; i++) {
    const d = document.createElement('div');
    d.className = 'pg';
    d.dataset.i = i;
    d.style.width = W + 'px';
    d.style.height = Math.round(W * ratio) + 'px';
    frag.appendChild(d);
  }
  $('pages').appendChild(frag);
  const slots = $('pages').children;
  await draw(slots[0], first);
  for (const d of slots) io.observe(d);

  /* save / remove the offline copy */
  const sv = $('sv');
  let isSaved = !!meta;
  const label = () => { sv.textContent = isSaved ? 'Saved offline' : 'Save offline'; sv.hidden = !navigator.onLine && !isSaved; };
  label();
  addEventListener('online', label);
  addEventListener('offline', label);
  sv.onclick = async () => {
    sv.disabled = true;
    try {
      if (isSaved) {
        if (confirm('Remove the offline copy from this phone?')) { await offlineRemove(id); isSaved = false; }
      } else {
        if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
        await offlineSave(me, id, (n, t) => { sv.textContent = 'Saving ' + n + '/' + t; });
        isSaved = true;
        toast('Saved. This note now opens without internet.');
      }
    } catch (e) { toast(e.message || 'Could not save'); }
    sv.disabled = false;
    label();
  };
} catch (e) {
  const s = $('state');
  s.hidden = false;
  s.textContent = 'Could not open these notes.';
  const m = document.createElement('div');
  m.className = 'muted';
  m.style.marginTop = '12px';
  m.textContent = String(e.message || e).slice(0, 200);
  s.appendChild(m);
  if (/Cosmic app/.test(String(e.message))) {
    const a = document.createElement('a');
    a.href = '/';
    a.textContent = 'Go to the download page';
    s.appendChild(a);
  }
}
</script>
</body>
</html>
