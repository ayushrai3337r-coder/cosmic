<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><link rel="manifest" href="/manifest.json"><link rel="icon" href="/icons/icon.svg"><link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>Cosmic - Sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Source+Serif+4:ital,wght@1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/glass.css">
</head>
<body>
<main class="auth">
  <div class="box liquid-glass-strong reveal">
    <a href="/" class="brand" id="brand" style="justify-content:center;margin-bottom:24px"></a>
    <div id="s1">
      <h1>Welcome to <em>cosmic</em></h1>
      <p class="sub" id="sub1">Continue with your Google account. No password to remember and no codes to wait for.</p>
      <button class="btn liquid-glass-strong hoverable block" id="g"><span class="icon-circle">G</span>Continue with Google</button>
    </div>
    <div id="s2" hidden>
      <h1>One last <em>step</em></h1>
      <p class="sub" id="who"></p>
      <div class="two">
        <label class="field"><span>First name</span><input class="input" id="fn"></label>
        <label class="field"><span>Last name</span><input class="input" id="ln"></label>
      </div>
      <label class="field"><span>Board</span><select class="input" id="board"><option value="msbte">MSBTE Diploma</option><option value="ssc">SSC Maharashtra</option></select></label>
      <label class="field" id="bf"><span>Branch</span><select class="input" id="branch"></select></label>
      <button class="btn liquid-glass-strong hoverable block" id="go">Create account</button>
    </div>
    <div id="s3" hidden>
      <h1>You are <em>in</em></h1>
      <p class="sub">Tap the button to go back to the Cosmic app.</p>
      <a class="btn white hoverable block" id="open">Open Cosmic</a>
    </div>
    <p class="msg" id="msg"></p>
    <p class="switch">One account works on one device only.</p>
  </div>
</main>
<script type="module">
import { icon, api, setToken, token, deviceId, lsGet, lsSet, lsDel, BRANCH, BRANCH_PICK } from '/js/app.js';
const $ = id => document.getElementById(id);
$('brand').innerHTML = icon('logo') + 'cosmic';
$('branch').innerHTML = BRANCH_PICK.map(k => `<option value="${k}">${BRANCH[k]}</option>`).join('');
$('board').onchange = () => { $('bf').hidden = $('board').value === 'ssc'; };
const say = t => { $('msg').textContent = t || ''; };
const stored = sessionStorage.getItem('msg');
if (stored) { say(stored); sessionStorage.removeItem('msg'); }

const q = new URLSearchParams(location.search);
const cap = window.Capacitor;
const NATIVE = !!(cap && cap.isNativePlatform && cap.isNativePlatform());
const challenge = q.get('c') || '';
const BROWSER_APP = q.get('app') === '1' && !NATIVE && /^[a-f0-9]{64}$/.test(challenge);
if (token() && !BROWSER_APP) location.replace('/dashboard');

let idToken = null, auth = null;
async function googleLogin() {
  const [{ initializeApp }, { getAuth, GoogleAuthProvider, signInWithPopup }] = await Promise.all([
    import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js'),
    import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js')
  ]);
  if (!auth) auth = getAuth(initializeApp(await (await fetch('/api/config')).json()));
  const cred = await signInWithPopup(auth, new GoogleAuthProvider());
  return cred.user.getIdToken();
}

const friendly = e => ({
  'auth/popup-closed-by-user': 'Sign in was cancelled.',
  'auth/cancelled-popup-request': 'Sign in was cancelled.',
  'auth/popup-blocked': 'Your browser blocked the Google window. Allow pop-ups for this site and try again.',
  'auth/unauthorized-domain': 'This website address is not added to Firebase Authorized domains yet.',
  'auth/operation-not-allowed': 'Google sign in is not turned on in Firebase yet.'
}[e.code] || e.message || 'Something went wrong. Try again.');

function showCode(code) {
  $('s1').hidden = true;
  $('s2').hidden = true;
  $('s3').hidden = false;
  const href = 'intent://auth?code=' + code + '#Intent;scheme=cosmic;package=com.cosmic.notes;end';
  $('open').href = href;
  location.href = href;
}

async function submit(profile) {
  const r = BROWSER_APP
    ? await api('/api/auth/app-code', { idToken, challenge, profile })
    : await api('/api/auth/login', { idToken, profile, deviceId: deviceId() });
  if (r.needsSignup) {
    const parts = (r.name || '').split(' ');
    $('fn').value = parts[0] || '';
    $('ln').value = parts.slice(1).join(' ');
    $('who').textContent = 'Signed in as ' + r.email + '. Tell us your board so we show the right notes.';
    $('s1').hidden = true;
    $('s2').hidden = false;
    return;
  }
  if (BROWSER_APP) return showCode(r.code);
  setToken(r.token);
  location.href = '/dashboard';
}

/* ----- inside the Android app: sign in through the phone browser, come back with a one-time code ----- */
async function sha256hex(s) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b), x => x.toString(16).padStart(2, '0')).join('');
}
async function finishNative(url) {
  const m = /^cosmic:\/\/auth\?code=([a-f0-9]{48})/.exec(url || '');
  if (!m) return;
  say('Signing you in...');
  try {
    const r = await api('/api/auth/exchange', { code: m[1], verifier: lsGet('cosmic_verifier') || '-', deviceId: deviceId() });
    lsDel('cosmic_verifier');
    setToken(r.token);
    location.replace('/dashboard');
  } catch (e) { say(e.message); $('g').disabled = false; }
}

if (NATIVE) {
  $('sub1').textContent = 'You will sign in with Google in your browser, then come straight back here.';
  const P = cap.Plugins || {};
  if (P.App) {
    P.App.addListener('appUrlOpen', e => finishNative(e.url));
    if (P.App.getLaunchUrl) P.App.getLaunchUrl().then(l => l && finishNative(l.url)).catch(() => {});
  }
  $('g').onclick = async () => {
    $('g').disabled = true;
    say('');
    try {
      const v = Array.from(crypto.getRandomValues(new Uint8Array(32)), x => x.toString(16).padStart(2, '0')).join('');
      lsSet('cosmic_verifier', v);
      const url = location.origin + '/login?app=1&c=' + await sha256hex(v);
      if (P.Browser) await P.Browser.open({ url }); else location.href = url;
    } catch (e) { say('Could not open the browser. Try again.'); }
    setTimeout(() => { $('g').disabled = false; }, 1500);
  };
} else {
  if (BROWSER_APP) $('sub1').textContent = 'Sign in with Google, then you will be sent back to the Cosmic app.';
  $('g').onclick = async () => {
    const b = $('g');
    b.disabled = true;
    say('');
    try {
      idToken = await googleLogin();
      await submit();
    } catch (e) { say(friendly(e)); }
    b.disabled = false;
  };
  $('go').onclick = async () => {
    const b = $('go');
    b.disabled = true;
    say('');
    try { await submit({ firstName: $('fn').value, lastName: $('ln').value, board: $('board').value, branch: $('branch').value }); }
    catch (e) { say(e.message); }
    b.disabled = false;
  };
}
</script>
</body>
</html>
