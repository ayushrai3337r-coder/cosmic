<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><link rel="manifest" href="/manifest.json"><link rel="icon" href="/icons/icon.svg"><link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>Cosmic - Sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Source+Serif+4:ital,wght@1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/glass.css">
</head>
<body>
<main class="auth">
  <div class="box liquid-glass-strong reveal">
    <a href="/" class="brand" id="brand" style="justify-content:center;margin-bottom:24px"></a>
    <div id="s1">
      <h1>Welcome to <em>cosmic</em></h1>
      <p class="sub">Continue with your Google account. No password to remember and no codes to wait for.</p>
      <button class="btn liquid-glass-strong hoverable block" id="g"><span class="icon-circle">G</span>Continue with Google</button>
    </div>
    <div id="s2" hidden>
      <h1>One last <em>step</em></h1>
      <p class="sub" id="who"></p>
      <div class="two">
        <label class="field"><span>First name</span><input class="input" id="fn"></label>
        <label class="field"><span>Last name</span><input class="input" id="ln"></label>
      </div>
      <label class="field"><span>Board</span><select class="input" id="board"><option value="msbte">MSBTE Diploma</option><option value="ssc">SSC Maharashtra</option></select></label>
      <label class="field" id="bf"><span>Branch</span><select class="input" id="branch"></select></label>
      <button class="btn liquid-glass-strong hoverable block" id="go">Create account</button>
    </div>
    <p class="msg" id="msg"></p>
    <p class="switch">One account works on one device at a time.</p>
  </div>
</main>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { mountBg, icon, api, setToken, BRANCH, BRANCH_PICK } from '/js/app.js';
mountBg();
const $ = id => document.getElementById(id);
$('brand').innerHTML = icon('logo') + 'cosmic';
$('branch').innerHTML = BRANCH_PICK.map(k => `<option value="${k}">${BRANCH[k]}</option>`).join('');
$('board').onchange = () => { $('bf').hidden = $('board').value === 'ssc'; };
const say = t => { $('msg').textContent = t || ''; };
const stored = sessionStorage.getItem('msg');
if (stored) { say(stored); sessionStorage.removeItem('msg'); }

const auth = getAuth(initializeApp(await (await fetch('/api/config')).json()));
let idToken = null;

const friendly = e => ({
  'auth/popup-closed-by-user': 'Sign in was cancelled.',
  'auth/cancelled-popup-request': 'Sign in was cancelled.',
  'auth/popup-blocked': 'Your browser blocked the Google window. Allow pop-ups for this site and try again.',
  'auth/unauthorized-domain': 'This website address is not added to Firebase Authorized domains yet.',
  'auth/operation-not-allowed': 'Google sign in is not turned on in Firebase yet.'
}[e.code] || e.code || e.message);

$('g').onclick = async () => {
  const b = $('g');
  b.disabled = true;
  say('');
  try {
    const cred = await signInWithPopup(auth, new GoogleAuthProvider());
    idToken = await cred.user.getIdToken();
    const r = await api('/api/auth/login', { idToken });
    if (r.needsSignup) {
      const parts = (r.name || '').split(' ');
      $('fn').value = parts[0] || '';
      $('ln').value = parts.slice(1).join(' ');
      $('who').textContent = 'Signed in as ' + r.email + '. Tell us your board so we show the right notes.';
      $('s1').hidden = true;
      $('s2').hidden = false;
    } else {
      setToken(r.token);
      location.href = '/dashboard';
      return;
    }
  } catch (e) { say(friendly(e)); }
  b.disabled = false;
};

$('go').onclick = async () => {
  const b = $('go');
  b.disabled = true;
  say('');
  try {
    const r = await api('/api/auth/login', { idToken, profile: { firstName: $('fn').value, lastName: $('ln').value, board: $('board').value, branch: $('branch').value } });
    setToken(r.token);
    location.href = '/dashboard';
    return;
  } catch (e) { say(e.message); }
  b.disabled = false;
};
</script>
</body>
</html>
