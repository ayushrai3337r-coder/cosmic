<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><link rel="icon" href="/icons/icon.svg"><meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>AR Academy - Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Source+Serif+4:ital,wght@1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/glass.css">
<style>
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;margin-top:14px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:6px}
.bar i{display:block;width:100%;min-height:3px;border-radius:6px;background:rgba(255,255,255,.75)}
.bar span{font-size:.62rem;color:rgba(255,255,255,.5)}
</style>
</head>
<body>
<main class="auth" id="gate">
  <div class="box liquid-glass-strong reveal">
    <a href="/" class="brand" id="brand" style="justify-content:center;margin-bottom:24px"></a>
    <h1>Admin <em>access</em></h1>
    <p class="sub">Restricted area. Enter the admin password.</p>
    <label class="field"><span>Password</span><input class="input" type="password" id="pw" autocomplete="current-password"></label>
    <button class="btn liquid-glass-strong hoverable block" id="in">Enter</button>
    <p class="msg" id="msg"></p>
  </div>
</main>

<div class="app" id="panel" hidden>
  <main class="content" style="max-width:1100px;margin:0 auto;width:100%">
    <div class="page-head"><div class="eyebrow">AR Academy admin</div><h1>Control <em>room</em></h1></div>
    <div class="chips" id="tabs">
      <button class="chip liquid-glass hoverable" data-t="orders">Orders</button>
      <button class="chip liquid-glass hoverable" data-t="sales">Sales</button>
      <button class="chip liquid-glass hoverable" data-t="upload">Upload</button>
      <button class="chip liquid-glass hoverable" data-t="notes">Notes</button>
      <button class="chip liquid-glass hoverable" data-t="users">Users</button>
      <button class="chip liquid-glass hoverable" data-t="chat">Messages <span id="cn"></span></button>
      <button class="chip liquid-glass hoverable" data-t="out">Sign out</button>
    </div>
    <div id="v"></div>
  </main>
</div>

<script type="module">
import { mountBg, icon, api, cloudUpload, esc, fmtDate, tag, toast, BRANCH, MEDIUM, brand } from '/js/app.js';
mountBg();
const $ = id => document.getElementById(id);
$('brand').innerHTML = brand;
const A = { admin: true };
let D = { orders: [], users: [], notes: [] }, tab = 'orders', filt = 'all', q = '';

async function load() {
  try { D = await api('/api/admin/data', undefined, A); $('gate').hidden = true; $('panel').hidden = false; draw(); chatLoad(); }
  catch (e) { sessionStorage.removeItem('at'); $('panel').hidden = true; $('gate').hidden = false; $('msg').textContent = 'Session ended. Enter the password again.'; }
}
$('in').onclick = async () => {
  try {
    const r = await api('/api/admin/login', { password: $('pw').value });
    sessionStorage.setItem('at', r.token);
    $('pw').value = '';
    $('msg').textContent = '';
    load();
  } catch (e) { $('msg').textContent = e.message; }
};
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('in').click(); });
if (sessionStorage.getItem('at')) load();

const stat = (l, n) => `<div class="card stat liquid-glass"><div class="label">${l}</div><div class="num">${n}</div></div>`;
const rs = n => 'Rs ' + Number(n || 0).toLocaleString('en-IN');

function ordersView() {
  const list = D.orders.filter(o => (filt === 'all' || o.status === filt) && (!q || [o.userName, o.phone, o.title].join(' ').toLowerCase().includes(q)));
  const c = s => D.orders.filter(o => o.status === s).length;
  return `
    <div class="grid g-stats">${stat('Orders', D.orders.length)}${stat('Pending', c('pending'))}${stat('Approved', c('approved'))}${stat('Users', D.users.length)}</div>
    <input class="input" id="q" placeholder="Search name, email or notes" value="${esc(q)}" style="margin:20px 0 14px">
    <div class="chips">${['all', 'pending', 'approved', 'rejected'].map(s => `<button class="chip liquid-glass hoverable ${filt === s ? 'on' : ''}" data-f="${s}">${s}</button>`).join('')}</div>
    <div class="list">${list.map(o => `
      <div class="row liquid-glass">
        <div class="grow"><h3>${esc(o.title)}</h3><div class="muted">${esc(o.userName)} &middot; ${esc(o.phone)} &middot; ${fmtDate(o.createdAt)} &middot; Order #${o.id}${o.utr ? ' &middot; UTR ' + esc(o.utr) : ''}${o.autoNote ? ' &middot; ' + esc(o.autoNote) : ''}</div></div>
        <div class="price">Rs ${o.amount}</div>
        ${o.shotUrl ? `<a class="btn liquid-glass hoverable sm" target="_blank" rel="noopener" href="${esc(o.shotUrl)}">Screenshot</a>` : '<span class="muted">No screenshot</span>'}
        ${tag(o.status)}
        <div class="acts">${['approved', 'rejected', 'pending'].filter(s => s !== o.status).map(s => `<button class="btn liquid-glass hoverable sm" data-o="${o.id}" data-s="${s}">${s === 'approved' ? 'Approve' : s === 'rejected' ? 'Reject' : 'Reset'}</button>`).join('')}</div>
      </div>`).join('') || '<div class="empty">No orders found</div>'}</div>`;
}

function salesView() {
  const ok = D.orders.filter(o => o.status === 'approved');
  const sum = a => a.reduce((s, o) => s + (Number(o.amount) || 0), 0);
  const now = new Date();
  const dayKey = d => new Date(d).toDateString();
  const today = ok.filter(o => dayKey(o.createdAt) === now.toDateString());
  const month = ok.filter(o => { const d = new Date(o.createdAt); return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear(); });
  const pending = D.orders.filter(o => o.status === 'pending');

  const per = {};
  ok.forEach(o => { const p = per[o.title] || (per[o.title] = { title: o.title, units: 0, total: 0 }); p.units++; p.total += Number(o.amount) || 0; });
  const rows = Object.values(per).sort((a, b) => b.total - a.total);

  const days = [];
  for (let i = 13; i >= 0; i--) {
    const d = new Date(now);
    d.setDate(d.getDate() - i);
    days.push({ label: d.getDate(), total: sum(ok.filter(o => dayKey(o.createdAt) === d.toDateString())) });
  }
  const max = Math.max(1, ...days.map(d => d.total));
  const recent = ok.slice().sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0, 8);

  return `
    <div class="grid g-stats">
      ${stat('Total sales', rs(sum(ok)))}${stat('Notes sold', ok.length)}${stat('Today', rs(sum(today)))}${stat('This month', rs(sum(month)))}
      ${stat('Pending value', rs(sum(pending)))}${stat('Average sale', ok.length ? rs(Math.round(sum(ok) / ok.length)) : 'Rs 0')}
    </div>
    <div class="card liquid-glass" style="margin-top:14px">
      <div class="eyebrow">Last 14 days (by order date)</div>
      <div class="bars">${days.map(d => `<div class="bar" title="${rs(d.total)}"><i style="height:${Math.round(d.total / max * 100)}%"></i><span>${d.label}</span></div>`).join('')}</div>
    </div>
    <div class="sec"><h2>Sales per <em>notes</em></h2></div>
    <div class="list">${rows.map(r => `
      <div class="row liquid-glass"><div class="grow"><h3>${esc(r.title)}</h3><div class="muted">${r.units} sold</div></div><div class="price">${rs(r.total)}</div></div>`).join('') || '<div class="empty">No approved sales yet</div>'}</div>
    <div class="sec"><h2>Recent sales</h2></div>
    <div class="list">${recent.map(o => `
      <div class="row liquid-glass"><div class="grow"><h3>${esc(o.title)}</h3><div class="muted">${esc(o.userName)} &middot; ${fmtDate(o.createdAt)}</div></div><div class="price">${rs(o.amount)}</div></div>`).join('') || '<div class="empty">No approved sales yet</div>'}</div>`;
}

const U = { board: 'msbte', branches: new Set(), sems: new Set(), medium: '' };
const pk = (cls, v, t, on) => `<button type="button" class="chip liquid-glass hoverable ${on ? 'on' : ''}" data-${cls}="${v}">${t}</button>`;
function uploadView() {
  const brs = Object.keys(BRANCH).filter(k => k !== 'ssc-general' && k !== 'all');
  return `
    <div class="card liquid-glass" style="max-width:720px">
      <div class="two">
        <label class="field"><span>Title</span><input class="input" id="u-title" placeholder="Engineering Maths Sem 1"></label>
        <label class="field"><span>Price (Rs, 0 for free)</span><input class="input" id="u-price" type="number" min="0" placeholder="49"></label>
      </div>
      <div class="eyebrow">Board</div>
      <div class="chips" id="pk-board" style="margin:10px 0 16px">${pk('ub', 'msbte', 'MSBTE Diploma', U.board === 'msbte')}${pk('ub', 'ssc', 'SSC Maharashtra', U.board === 'ssc')}</div>
      <div id="pk-msbte" ${U.board === 'ssc' ? 'hidden' : ''}>
        <div class="eyebrow">Department (tap one or more)</div>
        <div class="chips" id="pk-br" style="margin:10px 0 16px">${pk('br', 'all', 'All departments', U.branches.has('all'))}${brs.map(k => pk('br', k, BRANCH[k], U.branches.has(k))).join('')}</div>
        <div class="eyebrow">Semester (tap one or more)</div>
        <div class="chips" id="pk-sem" style="margin:10px 0 16px">${[1, 2, 3, 4, 5, 6].map(n => pk('sm', n, 'Sem ' + n, U.sems.has(String(n)))).join('')}${pk('sm', 'all', 'All', U.sems.has('all'))}</div>
      </div>
      <div id="pk-ssc" ${U.board === 'ssc' ? '' : 'hidden'}>
        <div class="eyebrow">Medium</div>
        <div class="chips" id="pk-med" style="margin:10px 0 16px">${pk('md', '', 'All mediums', U.medium === '')}${Object.entries(MEDIUM).map(([k, v]) => pk('md', k, v, U.medium === k)).join('')}</div>
      </div>
      <div class="two">
        <label class="field"><span>Subject code</span><input class="input" id="u-code" placeholder="22213"></label>
      </div>
      <label class="field"><span>Description</span><textarea class="input" id="u-desc" placeholder="What is inside these notes"></textarea></label>
      <label class="field"><span>PDF file (max 10 MB)</span><input class="input" id="u-file" type="file" accept="application/pdf"></label>
      <div class="muted" id="pk-sum" style="margin-bottom:14px"></div>
      <button class="btn liquid-glass-strong hoverable" id="up-go">${icon('upload')}Upload and publish</button>
    </div>`;
}
function pickSum() {
  const e = document.getElementById('pk-sum');
  if (!e) return;
  e.textContent = U.board === 'ssc' ? 'Will publish for SSC' + (U.medium ? ' (' + MEDIUM[U.medium] + ')' : ' (all mediums)') : (U.branches.size && U.sems.size ? 'Will publish for ' + (U.branches.has('all') ? 'all departments' : U.branches.size + ' department(s)') + ', ' + (U.sems.has('all') ? 'all semesters' : U.sems.size + ' semester(s)') : 'Choose at least one department and one semester');
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-ub],[data-br],[data-sm],[data-md]');
  if (!t || !document.getElementById('pk-sum')) return;
  const tog = (set, v) => { set.has(v) ? set.delete(v) : set.add(v); t.classList.toggle('on', set.has(v)); };
  if (t.dataset.ub) { U.board = t.dataset.ub; document.getElementById('pk-board').querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === t)); document.getElementById('pk-msbte').hidden = U.board === 'ssc'; document.getElementById('pk-ssc').hidden = U.board !== 'ssc'; }
  else if (t.dataset.br) { const v = t.dataset.br; if (v === 'all') { U.branches.clear(); document.getElementById('pk-br').querySelectorAll('.chip').forEach(c => c.classList.remove('on')); } else { U.branches.delete('all'); document.querySelector('#pk-br [data-br=all]').classList.remove('on'); } tog(U.branches, v); }
  else if (t.dataset.sm) { const v = t.dataset.sm; if (v === 'all') { U.sems.clear(); document.getElementById('pk-sem').querySelectorAll('.chip').forEach(c => c.classList.remove('on')); } else { U.sems.delete('all'); document.querySelector('#pk-sem [data-sm=all]').classList.remove('on'); } tog(U.sems, v); }
  else if (t.dataset.md !== undefined) { U.medium = t.dataset.md; document.getElementById('pk-med').querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === t)); }
  pickSum();
});

function notesView() {
  return `<div class="list">${D.notes.map(n => `
    <div class="row liquid-glass">
      <div class="grow"><h3>${esc(n.title)}</h3><div class="muted">${n.board === 'ssc' ? 'SSC' : 'MSBTE'} &middot; ${esc(BRANCH[n.branch] || n.branch)} &middot; Sem ${esc(n.semester)} &middot; ${n.pages ? n.pages + ' pages' : 'Re-upload needed'}</div></div>
      <div class="price">Rs ${n.price}</div>
      <span class="tag ${n.active ? 'ok' : 'no'}">${n.active ? 'Live' : 'Hidden'}</span>
      <div class="acts">
        <button class="btn liquid-glass hoverable sm" data-tg="${n.id}">${n.active ? 'Hide' : 'Show'}</button>
        <button class="btn liquid-glass hoverable sm" data-del="${n.id}">Delete</button>
      </div>
    </div>`).join('') || '<div class="empty">No notes uploaded yet</div>'}</div>`;
}

function usersView() {
  return `<div class="list">${D.users.map(u => `
    <div class="row liquid-glass">
      <div class="grow"><h3>${esc(u.name.trim() || 'Unnamed')}</h3><div class="muted">${esc(u.phone)} &middot; Joined ${fmtDate(u.createdAt)}</div></div>
      <span class="tag">${u.board === 'ssc' ? 'SSC' : 'MSBTE'}</span>
      <span class="muted">${esc(BRANCH[u.branch] || u.branch || '-')}</span>
      <span class="tag ok">${u.unlocked} unlocked</span>
      ${u.locked ? `<button class="btn liquid-glass hoverable sm" data-rd="${u.id}">Reset device</button>` : ''}
    </div>`).join('') || '<div class="empty">No users yet</div>'}</div>`;
}

/* ---------- messages: one private thread per student ---------- */
let CH = [], CU = null, CM = [];
const chatView = () => CU
  ? `<div class="row liquid-glass" style="margin-bottom:10px"><button class="btn liquid-glass hoverable sm" id="c-back">Back</button><div class="grow"><h3>${esc(CU.name.trim() || 'Student')}</h3><div class="muted">${esc(CU.email || '')}</div></div></div>
     <div class="chat liquid-glass" style="max-width:none;height:56vh"><div class="chat-list" id="cl">${CM.map(m => `<div class="bub ${m.fromAdmin ? 'me' : 'them'}"><div>${esc(m.body)}</div><small>${fmtDate(m.at)}</small></div>`).join('') || '<div class="muted" style="text-align:center;padding:20px">No messages</div>'}</div>
     <form class="chat-in" id="c-form"><input class="input" id="c-t" maxlength="1000" placeholder="Reply to this student" autocomplete="off"><button class="btn white hoverable" type="submit">Send</button></form></div>`
  : `<div class="list">${CH.map(c => `<button class="row liquid-glass hoverable" data-c="${c.id}" style="width:100%;text-align:left"><div class="grow"><h3>${esc(c.name.trim() || 'Student')}</h3><div class="muted" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw">${esc(c.last || '')}</div></div>${c.unread ? `<span class="tag ok">${c.unread} new</span>` : ''}<span class="muted">${fmtDate(c.lastAt)}</span></button>`).join('') || '<div class="empty">No messages yet</div>'}</div>`;
async function chatLoad() {
  try {
    if (CU) {
      CM = (await api('/api/admin/chats/' + CU.id, undefined, A)).messages;
      if (tab === 'chat' && CU) { const l = $('cl'); const keep = l ? l.scrollHeight - l.scrollTop - l.clientHeight < 80 : true; const t = $('c-t') ? $('c-t').value : ''; $('v').innerHTML = chatView(); if ($('c-t')) $('c-t').value = t; if (keep && $('cl')) $('cl').scrollTop = $('cl').scrollHeight; }
    } else {
      CH = (await api('/api/admin/chats', undefined, A)).chats;
      if (tab === 'chat' && !CU) $('v').innerHTML = chatView();
    }
    const n = CH.reduce((a, c) => a + c.unread, 0);
    $('cn').textContent = n ? '(' + n + ')' : '';
  } catch (e) {}
}
setInterval(() => { if (!document.hidden && !$('panel').hidden) chatLoad(); }, 8000);
$('v').addEventListener('click', e => {
  const c = e.target.closest('[data-c]');
  if (c) { CU = CH.find(x => String(x.id) === c.dataset.c); chatLoad().then(() => { const l = $('cl'); if (l) l.scrollTop = l.scrollHeight; }); }
  if (e.target.closest('#c-back')) { CU = null; chatLoad(); }
});
$('v').addEventListener('submit', async e => {
  if (e.target.id !== 'c-form') return;
  e.preventDefault();
  const t = $('c-t').value.trim();
  if (!t || !CU) return;
  $('c-t').value = '';
  try { await api('/api/admin/chats/' + CU.id, { body: t }, A); await chatLoad(); const l = $('cl'); if (l) l.scrollTop = l.scrollHeight; } catch (err) { toast(err.message); }
});

function draw() {
  document.querySelectorAll('#tabs .chip').forEach(c => c.classList.toggle('on', c.dataset.t === tab));
  $('v').innerHTML = { orders: ordersView, sales: salesView, upload: uploadView, notes: notesView, users: usersView, chat: chatView }[tab]();
  if (tab === 'chat') chatLoad();
  if (tab === 'upload') pickSum();
  const s = $('q');
  if (s && q) { s.focus(); s.setSelectionRange(q.length, q.length); }
}

$('tabs').addEventListener('click', e => {
  const c = e.target.closest('[data-t]');
  if (!c) return;
  if (c.dataset.t === 'out') { sessionStorage.removeItem('at'); location.reload(); return; }
  tab = c.dataset.t;
  draw();
});
$('v').addEventListener('input', e => { if (e.target.id === 'q') { q = e.target.value.toLowerCase().trim(); draw(); } });

$('v').addEventListener('click', async e => {
  const t = e.target;
  try {
    const f = t.closest('[data-f]');
    if (f) { filt = f.dataset.f; return draw(); }
    const o = t.closest('[data-o]');
    if (o) { await api('/api/admin/orders/' + o.dataset.o, { status: o.dataset.s }, A); return load(); }
    const rd = t.closest('[data-rd]');
    if (rd) {
      if (!confirm('Let this user sign in on a new device?')) return;
      await api('/api/admin/users/' + rd.dataset.rd + '/reset', {}, A);
      toast('Device reset');
      return load();
    }
    const tg = t.closest('[data-tg]');
    if (tg) { await api('/api/admin/notes/' + tg.dataset.tg + '/toggle', {}, A); return load(); }
    const del = t.closest('[data-del]');
    if (del) {
      if (!confirm('Delete these notes and their orders permanently?')) return;
      await api('/api/admin/notes/' + del.dataset.del, undefined, { admin: true, method: 'DELETE' });
      return load();
    }
    const up = t.closest('#up-go');
    if (up) {
      const file = $('u-file').files[0], title = $('u-title').value.trim(), price = $('u-price').value;
      if (!title || price === '' || !file) return toast('Title, price and a PDF are required');
      if (U.board === 'msbte' && (!U.branches.size || !U.sems.size)) return toast('Choose at least one department and one semester');
      if (file.type !== 'application/pdf') return toast('Only PDF files are allowed');
      if (file.size > 10 * 1024 * 1024) return toast('This PDF is over 10 MB. Compress it first.');
      up.disabled = true;
      toast('Uploading, please wait');
      try {
        const sign = await api('/api/admin/sign', {}, A);
        const pdfPublicId = await cloudUpload(file, sign);
        const r = await api('/api/admin/notes', {
          title, price, pdfPublicId,
          board: U.board, branches: [...U.branches], semesters: [...U.sems], medium: U.medium,
          subjectCode: $('u-code').value.trim(), description: $('u-desc').value.trim()
        }, A);
        toast('Published ' + r.made + ' listing' + (r.made > 1 ? 's' : '') + ' (' + r.pages + ' pages)');
        tab = 'notes';
        await load();
      } finally { up.disabled = false; }
    }
  } catch (err) { toast(err.message); draw(); }
});
</script>
</body>
</html>
